<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Chat Application</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>

<h2>One to One Chat | Spring boot & Websocket | By Alibou</h2>

<div class="user-form" id="username-page">
    <h2>Enter Chatroom</h2>
    <form id="usernameForm" onsubmit="sendMessage(); return false;")>
        <span id="userIdSpan">
            <label for="userId">UserId:</label>
            <input type="text" id="userId" name="userId" required>
        </span>
        <span id="recipientIdSpan" hidden="true">
            <label for="recipientIdSelect">RecipientId:</label>
            <select id="recipientIdSelect" name="recipientIdSelect" style="width: 100%">
                <option value="all">All</option>
            </select>

        </span>

        <label for="content">Content:</label>
        <textarea id="content" name="content" rows="20" cols="45" required></textarea>


        <hr>
        <p id="messageArea"></p>

        <button type="submit" style="margin-top: 10px">Enter Chatroom</button>
    </form>
</div>
<script>
    let socket = new SockJS('http://localhost:8088/ws');
    let stompClient = Stomp.over(socket);
    let sessionId
    //set of recipients
    let recipients = new Set();

    stompClient.connect({},
        function (){
        stompClient.subscribe('/topic/public', function (message) {
            console.log("Received message: " + message.body);
            let msg = JSON.parse(message.body);
            let senderId= msg.senderId
            let li =  document.createElement("li");
            li.appendChild(document.createTextNode(senderId + ": " + msg.content));
            document.getElementById("messageArea").appendChild(li)

            let recipientSelect = document.getElementById("recipientIdSelect");
            let recipientOption = document.createElement("option");


            //add sender to recipient list
            if (senderId && senderId !==sessionId){
                recipientOption.value=senderId
                recipientOption.text=senderId
                if (!recipients.has(senderId)){
                    recipientSelect.appendChild(recipientOption);
                    recipients.add(senderId);
                }
            }
        });
    });

    function sendMessage() {
        if (!sessionId) {
            let userIdSpan = document.getElementById("userIdSpan");
            let userId = document.getElementById("userId");
            sessionId = userId.value.trim().toLowerCase();
            userIdSpan.remove()
        }
        let recipientIdSpan = document.getElementById("recipientIdSpan");
        recipientIdSpan.hidden= false


        console.log(sessionId)
        let content = document.getElementById("content");
        let contentVal = content.value.trim();
        // console.log("UserId: " + userIdVal + ", Content: " + contentVal);
        if(stompClient) {
            let chatMessage = {
                senderId: sessionId,
                content: contentVal
            };
            console.log("Sending message: " + JSON.stringify(chatMessage));
            stompClient.send("/app/pingMessage", {}, JSON.stringify(chatMessage));
            content.value='';
        }
    }

    // function to return if sessionId is set
    function isSessionIdSet() {
        return sessionId !== undefined && sessionId !== null && sessionId !== '';
    }


</script>
</body>
</html>
